server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  location = /health {
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # Answer API → the daily-api Node service on the private compose network.
  # A resolver + variable defers DNS to request time so nginx still boots if the
  # api container starts a moment later.
  location /api/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $daily_api http://api:8090;
    proxy_pass $daily_api$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 20s;
  }

  # long cache for hashed build assets
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA history fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
